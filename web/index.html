<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Fetcher</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="pulse" aria-hidden="true"></span>
        <h1>Job Fetcher</h1>
      </div>
      <div class="topbar-actions">
        <span id="rate" class="rate" title="Adaptive poll cadence"></span>
        <span id="status" class="status">connecting…</span>
        <button id="notify-btn" class="btn btn-ghost" hidden>Enable alerts</button>
        <button id="refresh-btn" class="btn">Check now</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <section class="panel">
          <h2>New watch</h2>
          <form id="watch-form" autocomplete="off">
            <label>
              Job title / keywords
              <input name="keywords" placeholder="front-end developer" required maxlength="120" />
            </label>
            <label>
              Location
              <input name="location" placeholder="Melbourne, Victoria, Australia" maxlength="120" />
            </label>
            <label>
              Look back
              <select name="window">
                <option value="1h" selected>Past hour</option>
                <option value="2h">Past 2 hours</option>
                <option value="4h">Past 4 hours</option>
                <option value="8h">Past 8 hours</option>
                <option value="24h">Past 24 hours</option>
              </select>
            </label>

            <fieldset>
              <legend>Workplace</legend>
              <label class="check"><input type="checkbox" name="remote" value="1" /> On-site</label>
              <label class="check"><input type="checkbox" name="remote" value="2" /> Remote</label>
              <label class="check"><input type="checkbox" name="remote" value="3" /> Hybrid</label>
            </fieldset>

            <button type="submit" class="btn btn-primary btn-block">Add watch</button>
            <p class="form-error" id="form-error" hidden></p>
          </form>
        </section>

        <section class="panel">
          <h2>Watches <span id="watch-count" class="count">0</span></h2>
          <ul id="watch-list" class="watch-list"></ul>
        </section>

        <section class="panel">
          <h2>Polling</h2>
          <dl id="health" class="health"></dl>
        </section>
      </aside>

      <section class="feed">
        <div class="feed-head">
          <div class="filters">
            <button class="chip is-active" data-filter="all">All</button>
            <button class="chip" data-filter="unread">
              Unread <span id="unread-badge" class="badge" hidden>0</span>
            </button>
          </div>
          <button id="mark-all" class="btn btn-ghost">Mark all read</button>
        </div>
        <ul id="job-list" class="job-list"></ul>
        <p id="empty" class="empty">
          No postings yet. Add a watch and results will appear here as they're posted.
        </p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
